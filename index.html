<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),K="eutopia18_v2",TOTAL=18,RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
/* ✏️ EDIT: the message inside the little chest */

/* ✏️ EDIT: the reward for finding every secret */

function tone(f,t=0,d=.4,v=.04){if(S.mute||!au)return;try{const n=au.currentTime+t,o=au.createOscillator(),g=au.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(Math.min(v*3,.25),n+.04);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(au.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
const P=[262,294,330,392,440,523];

const ch=$("#ch");

function nxt(){if(li>=lines.length)return;const[w,t]=lines[li++],n=$("#nm");n.textContent=w;n.style.display=w?"":"none";n.classList.toggle("pl",w==="Anuva");n.classList.toggle("lb",w==="Labiba");$("#tx").classList.toggle("nar",!w);full=emo(t);typing=true;$("#ar").style.opacity=0;clearTimeout(tm);if(RM){end();return}let i=0;const cs=Array.from(full);const tick=()=>{i++;$("#tx").textContent=cs.slice(0,i).join("")+"▌";if(i>=cs.length){end();return}const c=cs[i-1];if(i%3===0)tone(820+Math.random()*160,0,.04,.008);tm=setTimeout(tick,/[.!?…”]/.test(c)?340:/[,;:—]/.test(c)?170:36)};tick()}
function say(L,c){lines=L;li=0;cb=c||null;nxt()}
$("#box").onclick=()=>{if(typing)end();else nxt()};
function btn(t,f,p){const b=document.createElement("button");b.className="b"+(p?" p":"");b.textContent=t;b.onclick=f;ch.appendChild(b)}
function find(id){if(has(id))return;S.found.push(id);save();hud();tone(660,0,.3);tone(880,.1,.3);tone(1174,.2,.4);if(S.found.length>=TOTAL&&!S.all){S.all=true;S.fin=S.t;save();tone(1046,.5,1);toast("✦ Every secret found! Something has appeared on the map…")}else toast("✦ Secret discovered! "+S.found.length+"/"+TOTAL)}
let last=Date.now(),run=false,tc=0;

const LETTER=`Dear Anuva,

Congratulations. You have officially survived seventeen years of questionable decisions, dramatic plot twists, and the occasional disagreement with basic probability. The kingdom is impressed. I am exhausted, but impressed.

Jokes aside, there is a lot more to you than the chaos everyone sees first. You care about people in the little things. what you notice, what you remember, the room you make for someone else’s feelings even when you have plenty of your own. You can be dramatic, delusional, and able to turn an ordinary conversation into an event requiring witnesses. You are also thoughtful, funny, and far more caring than you give yourself credit for.

Somewhere between the late-night conversations, ridiculous arguments, mutual roasting, and the legendary scientific theory that everything is about “destiny and hormones,” you became someone whose conversations I genuinely value. Even when it’s complete nonsense. Especially then. And yes, Bilashi, that includes when you’re being spectacularly unreasonable. Don’t look so pleased with yourself. This is a limited-time royal compliment.

Now you’re eighteen, and everyone will act as if you should have act like an old women or something like that. You don’t have to. You’re allowed to change your mind, start again, take the long way around, outgrow what no longer fits, and write a future that looks nothing like the one people expected. Never let anyone convince you that your story is already decided. Not a prophecy, your destiny, not the world. Destiny is something you wrote yourself. God just knew what you are going to write.

You owe me no response. This is a gift, not a question. But still I'll wait.

you know, I've a weird desire of waiting for things that will never be mine :)

Happy eighteenth birthday, Anuva.



Warmly (but don’t tell anyone),
Mahmud
Royal Advisor of Eutopia`;
