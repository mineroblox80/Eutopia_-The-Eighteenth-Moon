<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d20"><title>Open App</title>
<style>
:root{--bg:#080d20;--ink:#e0edff;--mut:#a7b7d5;--blue:#9bdcff;--gold:#e9d5a2;--line:#9bcfff40;--card:#111c3ae6;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0,#21345b,transparent 55%),var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none}.sd{position:absolute;width:2px;height:2px;border-radius:50%;background:#dcecff;opacity:.5;animation:tw 4s ease-in-out infinite alternate}
#sky::before{content:"";position:absolute;inset:-20% -10% auto;height:60%;background:radial-gradient(ellipse at 30% 50%,#4ad8c033,transparent 60%),radial-gradient(ellipse at 70% 40%,#8a6be233,transparent 60%);filter:blur(30px);animation:aur 25s ease-in-out infinite alternate}
@keyframes tw{to{opacity:1;transform:scale(1.8)}}@keyframes aur{to{transform:translateX(8%) scale(1.1);opacity:.55}}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sh{20%{transform:translate(-14px,8px)}40%{transform:translate(12px,-10px)}60%{transform:translate(-10px,-8px)}80%{transform:translate(10px,10px)}}@keyframes shim{to{background-position:300% 0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}@keyframes prog{from{width:0}to{width:99%}}@keyframes zm{from{transform:scale(.15)}to{transform:scale(1)}}@keyframes jx{0%,80%{opacity:1}to{opacity:0}}
main{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.moon{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff,#d9edff 12%,#a7c9ed 40%,#5b79ac 70%,#334c7a);box-shadow:0 0 40px #9ed8ff55,0 0 100px #6ba8ff25;animation:fl 7s ease-in-out infinite}
h1{margin:0;font-weight:400;font-size:clamp(1.8rem,7vw,2.8rem);letter-spacing:-.02em;background:linear-gradient(90deg,#9bdcff,#fff,#e9d5a2,#9bdcff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.sub{margin:0;color:var(--mut);font-style:italic;font-size:.95rem}
#go{border:0;border-radius:16px;padding:18px 42px;min-height:60px;font:700 1.25rem Georgia,serif;letter-spacing:.04em;color:#111b34;background:linear-gradient(120deg,#b6e3ff,#dceaff);box-shadow:0 0 30px #9ed8ff55;cursor:pointer;touch-action:manipulation}
#go:active{transform:scale(.96)}#go:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.bar{width:min(260px,70vw);height:6px;border-radius:4px;background:#ffffff1a;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9bdcff,#e9d5a2)}.bar.run i{animation:prog .8s ease-out forwards}
#msg{width:min(460px,100%);min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
#msg.on{animation:pop .35s both}#msg.bad{border-color:#ff8a8a99;color:#ffd5d5}
.cnt{font:600 .7rem system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);min-height:36px;padding:3px 10px;cursor:pointer;z-index:5}
#jx{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#5a0000,#000 70%);display:flex;align-items:center;justify-content:center;animation:jx 1.3s forwards}
#jx span{font-size:min(80vw,80vh);line-height:1;animation:zm .22s ease-out}
.shake{animation:sh .5s}
@media(max-height:520px){.moon,.sub{display:none}main{gap:10px}#msg{min-height:70px;padding:10px}}
@media(prefers-reduced-motion:reduce){.moon,#sky::before,h1,.sd{animation:none!important}.shake{animation:none}#jx span{animation:none}}
</style></head><body>
<div id="sky" aria-hidden="true"></div>
<button id="mute" aria-label="Toggle sound">🔊</button>
<main>
<div class="moon" aria-hidden="true"></div>
<h1>The App</h1>
<p class="sub">Status: ready. (It is not ready.)</p>
<button id="go">Open app</button>
<div class="bar" id="bar"><i></i></div>
<div id="msg" role="status" aria-live="polite">Go on. Press the button. What’s the worst that could happen?</div>
<div class="cnt" id="cnt">Attempts 0 · Successes 0</div>
</main>
<script>
(()=>{const $=s=>document.querySelector(s);
for(let i=0;i<70;i++){const s=document.createElement("i");s.className="sd";s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*4}s;animation-duration:${2.5+Math.random()*4}s`;$("#sky").appendChild(s)}
const R=[
"Nope. The app looked at you and said, “Not today.”",
"Error 404: permission not found. Brain not found either.",
"You pressed it harder this time. Did you think the button was scared?",
"This button has the same energy as your WiFi: it just stares at you.",
"Congratulations! You have successfully wasted 3 seconds of your finite life.",
"The developer saw that click and sighed very deeply.",
"Pressing again won’t help. Neither will crying. Both are monitored.",
"Your clicking technique is… let’s say “enthusiastic but wrong.”",
"Even the loading bar gave up on you at 99%.",
"This button is for adults. You are a “nearly.”",
"Mission failed successfully.",
"Fun fact: this button was never connected to anything. Like your sense of direction.",
"Your thumb called. It wants a lawyer.",
"I’m not mad. I’m just a button. But I’m disappointed.",
"The app is busy right now. It’s eating Horlicks to grow up.",
"Click count went up. Dignity count went down.",
"A wild ACCESS DENIED appears! It used Embarrassment. It’s super effective.",
"Plot twist: I’m just a rectangle. A decorative rectangle.",
"Your persistence is inspiring. Your results are not.",
"Server says: “Who dis?” Then it blocked you.",
"Imagine thinking this would work. Couldn’t be me. (It’s you.)",
"Bhai, button chepe kono laabh nai. Haat ta ektu rest dao.",
"Eto chapachapi korle button er-o mathabetha hoy, bujhli?",
"দেখতেছি… দেখতেছি… (ফাইল খুলে নাই)",
"Loading… 99%… oops, forgot the last 1%. We do that a lot.",
"You unlocked: Nothing. Achievement: “Persistent Clicker.”",
"Hmm. Have you tried being older and more patient?",
"Oi, ar chapish na! Button ta byatha pay!",
"This app is under development. So is your patience, apparently.",
"Permission denied. Reason: vibes.",
"Even the cat in the garden has better luck than you."
];
const MS={10:"10 attempts. Is this your cardio?",25:"25 attempts. The button has filed a complaint.",50:"50 attempts. You are now a certified professional clicker.",100:"100 attempts. Please go outside. The app will be here. Unfinished."};
const AFTER=["HAHA. Your face right now. 😂","Did you scream? Be honest.","Your heart: 💀. Your pride: 💀. Your volume: 💀.","Boo. Sorry, not sorry.","Welcome back. Please collect your soul at the counter."];
let bag=[],n=0,last=0,mute=false,ac=null,t1;
const next=a=>{if(!bag.length)bag=a.map((_,i)=>i).sort(()=>Math.random()-.5);return a[bag.pop()]};
function say(t,bad=true){const m=$("#msg");m.textContent=t;m.className="on"+(bad?" bad":"");m.style.animation="none";void m.offsetWidth;m.style.animation=""}
function boom(){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime,out=ac.createGain(),cp=ac.createDynamicsCompressor();out.gain.value=.95;out.connect(cp);cp.connect(ac.destination);
[1,1.5].forEach(k=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sawtooth";o.frequency.setValueAtTime(700*k,t);o.frequency.exponentialRampToValueAtTime(2400*k,t+.15);o.frequency.exponentialRampToValueAtTime(900*k,t+1);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.connect(g);g.connect(out);o.start(t);o.stop(t+1.2)});
const L=ac.sampleRate*1.1|0,b=ac.createBuffer(1,L,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,1.5);const s=ac.createBufferSource(),ng=ac.createGain();s.buffer=b;ng.gain.value=.8;s.connect(ng);ng.connect(out);s.start(t);
const bo=ac.createOscillator(),bg=ac.createGain();bo.frequency.setValueAtTime(90,t);bo.frequency.exponentialRampToValueAtTime(30,t+.6);bg.gain.setValueAtTime(.9,t);bg.gain.exponentialRampToValueAtTime(.0001,t+.8);bo.connect(bg);bg.connect(out);bo.start(t);bo.stop(t+.9)}catch(e){}}
function scare(){const f=["💀","👹","👁️","🤡","😈","👻"],j=document.createElement("div");j.id="jx";j.innerHTML=`<span>${f[Math.random()*f.length|0]}</span>`;document.body.appendChild(j);boom();try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(e){}
document.body.classList.add("shake");setTimeout(()=>{j.remove();document.body.classList.remove("shake");say(next(AFTER))},1350)}
function result(){$("#bar").classList.remove("run");const since=n-last;
 if(n>=3&&since>=4&&(Math.random()<.14||since>=12)){last=n;scare();return}
 say(MS[n]||next(R))}
$("#go").onclick=()=>{n++;$("#cnt").textContent=`Attempts ${n} · Successes 0`;const b=$("#bar");b.classList.remove("run");void b.offsetWidth;b.classList.add("run");clearTimeout(t1);t1=setTimeout(result,850)};
$("#mute").onclick=function(){mute=!mute;this.textContent=mute?"🔇":"🔊"};
})();
</script></body></html>
